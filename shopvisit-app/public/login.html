<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Shop Visit App</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top">
  <h1>Shop Visit App</h1>
  <div class="sub">Admin / Distributor / Manager Login</div>
</header>
<div class="wrap">
  <div id="msg"></div>
  <form id="loginForm" class="card">
    <label for="username">Username</label>
    <input id="username" type="text" required autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button type="submit" class="block" style="margin-top:18px;">Login</button>
  </form>
  <p class="small" style="text-align:center;"><a class="link" href="/">← Back to Visit Entry Form</a></p>
</div>
<script src="/js/login.js"></script>
</body>
</html>
