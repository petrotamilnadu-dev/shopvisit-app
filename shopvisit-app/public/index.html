<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shop Visit Entry</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#00A99D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shop Visit">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top">
  <h1>Shop Visit Entry</h1>
  <div class="sub" id="staffLabel">Enter your PIN to continue</div>
</header>

<div class="wrap">
  <div id="msg"></div>

  <!-- SCREEN 1: PIN entry -->
  <form id="pinForm" class="card">
    <label for="pin">Your 4-digit PIN</label>
    <input id="pin" type="tel" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="e.g. 4821" required autofocus>
    <button type="submit" class="block" style="margin-top:18px;">Continue</button>
  </form>

  <!-- SCREEN 1.5: Nearby shop picker (shown after GPS check, before IN form) -->
  <form id="shopPickerForm" class="card" style="display:none;">
    <p class="small" style="margin-top:0;">Found shop(s) near your current location — tap one if you're visiting it again, or add a new shop.</p>
    <div id="nearbyShopsList"></div>
    <button type="button" id="newShopBtn" class="secondary block" style="margin-top:14px;">+ Add a New Shop</button>
    <button type="button" id="changePinBtn0" class="secondary block" style="margin-top:10px;">Not you? Change PIN</button>
  </form>

  <!-- SCREEN 2: Shop IN form -->
  <form id="inForm" class="card" style="display:none;">
    <p class="small" style="margin-top:0;">New Shop Visit — <b>IN Time</b></p>

    <label for="shopName">Shop Name</label>
    <input id="shopName" type="text" placeholder="e.g. Sri Ram Auto Spares" style="text-transform:uppercase;" required>

    <label for="location">Location</label>
    <input id="location" type="text" placeholder="Area / landmark" style="text-transform:uppercase;">

    <label for="contactNumber">Contact Number</label>
    <input id="contactNumber" type="tel" inputmode="numeric" pattern="\d*" placeholder="10-digit number">

    <label>Shop Type</label>
    <div class="row">
      <label style="font-weight:400;"><input type="radio" name="shop_type" value="RETAILER" required> Retailer</label>
      <label style="font-weight:400;"><input type="radio" name="shop_type" value="MECHANIC"> Mechanic</label>
      <label style="font-weight:400;"><input type="radio" name="shop_type" value="IWS"> IWS</label>
    </div>

    <label>Segment / Category</label>
    <div class="row">
      <label style="font-weight:400;"><input type="radio" name="segment" value="CVL" required> CVL</label>
      <label style="font-weight:400;"><input type="radio" name="segment" value="PCMO"> PCMO</label>
      <label style="font-weight:400;"><input type="radio" name="segment" value="MCO"> MCO</label>
    </div>

    <label>Outlet Status</label>
    <div class="row">
      <label style="font-weight:400;"><input type="radio" name="outlet_status" value="NEW" required> New</label>
      <label style="font-weight:400;"><input type="radio" name="outlet_status" value="EXISTING"> Existing</label>
    </div>

    <label for="photo">Photo (GPS location auto-captured)</label>
    <input id="photo" type="file" accept="image/*" capture="environment">
    <div id="photoReuseNote" class="small" style="margin-top:6px; display:none;"></div>
    <div id="gpsStatus" class="small" style="margin-top:6px;"></div>

    <button type="submit" id="checkinBtn" class="block" style="margin-top:18px;">Check IN to this Shop</button>
    <button type="button" id="changePinBtn1" class="secondary block" style="margin-top:10px;">Not you? Change PIN</button>
  </form>

  <!-- SCREEN 3: Shop OUT form -->
  <form id="outForm" class="card" style="display:none;">
    <p class="small" style="margin-top:0;">
      You have an open visit at <b id="openShopName"></b> — give <b>OUT Time</b> details to finish this visit.
    </p>

    <label for="ordersLtrs">Orders (in Ltrs)</label>
    <input id="ordersLtrs" type="tel" inputmode="decimal" pattern="[0-9.]*" placeholder="e.g. 20">

    <label for="collectionRs">Collection (in Rupees)</label>
    <input id="collectionRs" type="tel" inputmode="decimal" pattern="[0-9.]*" placeholder="e.g. 5000">

    <label for="activeTertiary">Active / Tertiary</label>
    <input id="activeTertiary" type="text" placeholder="e.g. Active">

    <label for="remarks">Remarks &amp; Feedback</label>
    <textarea id="remarks" placeholder="Any remarks about this shop visit"></textarea>

    <button type="submit" id="checkoutBtn" class="block" style="margin-top:18px;">Check OUT of this Shop</button>
    <button type="button" id="changePinBtn2" class="secondary block" style="margin-top:10px;">Not you? Change PIN</button>
  </form>

  <p class="small" style="text-align:center;">
    <a class="link" href="/login.html">Admin / Manager Login →</a>
  </p>
</div>

<script src="/js/entry.js"></script>
</body>
</html>
